name: Build TWRP for vivo Y83

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'recoveryimage'
      lunch_flavor:
        description: 'Lunch combo flavor'
        required: true
        default: 'omni_y83-eng'
  push:
    branches: [ main, master ]
    paths:
      - '**.mk'
      - '**.fstab'
      - 'prebuilt/**'
      - 'root/**'
      - '.github/workflows/twrp.yml'

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git'
  MANIFEST_BRANCH: 'twrp-8.1'
  DEVICE_TREE_PATH: 'device/vivo/y83'
  BUILD_DIR: 'twrp-src'

jobs:
  build:
    name: Build recovery image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree (into workspace root)
        uses: actions/checkout@v4
        with:
          path: device_tree_checkout
          fetch-depth: 1

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # Main toolchain deps
          sudo apt-get install -y -qq \
            git ccache gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python2 python3 python3-pip repo || \
            sudo apt-get install -y -qq python2-minimal python3 python3-pip repo
          # AOSP 8.1 clang needs libncurses.so.5 (22.04 only ships .so.6);
          # also install common 32-bit compat libs. Failures here are tolerated.
          sudo apt-get install -y -qq \
            libncurses5:i386 libstdc++6:i386 zlib1g:i386 lib32readline6 \
            libncurses5 libncursesw5 libtinfo5 || true
          # Fallback: if libncurses.so.5 is absent on 22.04, symlink the .so.6
          # (ABI-compatible for the legacy clang that only needs terminfo).
          if ! ls /usr/lib/x86_64-linux-gnu/libncurses.so.5 >/dev/null 2>&1; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          # Do NOT install python-is-python3; force `python` -> Python 2
          # so the twrp-8.1 envsetup/roomservice.py (Py2 syntax) works.
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python2.7 || true
          echo "== Tool versions =="
          git --version
          repo --version 2>&1 | head -1 || true
          python --version 2>&1 || true
          python2 --version 2>&1 || true
          python3 --version
          ls -l /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>&1 || true
          java -version 2>&1 | head -2

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Free disk space
        run: |
          echo "== Before =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          echo "== After =="
          df -h /

      - name: Initialize TWRP minimal manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/$BUILD_DIR
          cd $GITHUB_WORKSPACE/$BUILD_DIR
          repo init -u $MANIFEST_URL -b $MANIFEST_BRANCH --depth=1 --current-branch

      - name: Sync source tree (shallow)
        run: |
          cd $GITHUB_WORKSPACE/$BUILD_DIR
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --current-branch --force-sync

      - name: Place device tree into build
        run: |
          cd $GITHUB_WORKSPACE/$BUILD_DIR
          mkdir -p device/vivo
          cp -r "$GITHUB_WORKSPACE/device_tree_checkout" "device/vivo/y83"
          echo "== Device tree files =="
          find device/vivo/y83 -maxdepth 2 -type f | sort

      - name: Build recovery
        run: |
          cd $GITHUB_WORKSPACE/$BUILD_DIR
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          # minimal-manifest-twrp: soong scans the whole framework tree, but
          # the manifest only ships recovery-needed sources. Skip missing deps.
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch "${{ github.event.inputs.lunch_flavor || 'omni_y83-eng' }}"
          SRC=$GITHUB_WORKSPACE/$BUILD_DIR
          # Robust fix for soong's `--header_version 0`:
          #   - soong's MkbootImage rule always passes `--header_version 0`,
          #     but the twrp-8.1 host mkbootimg (Android 8.1 ArgumentParser)
          #     does not define that flag and refuses it.
          #   - header_version 0 == legacy boot header, so it is SAFE to drop.
          #   - Fix: `parser.parse_args()` -> `parser.parse_known_args()[0]`
          #     (parse_known_args ignores unknown flags; [0] keeps the
          #     Namespace, since parse_known_args() itself returns a tuple).
          #   - We patch BEFORE the first build, so ninja compiles/installs the
          #     patched script once. Patching *after* a failure is unreliable
          #     because ninja then re-copies the (already patched) file, and a
          #     narrow sed pattern may silently match nothing while still
          #     printing "patched" (sed exits 0 even with 0 substitutions).
          echo "== Patching mkbootimg for soong --header_version =="
          found=0
          # generic match on `parse_args()` -> `parse_known_args()[0]`
          for b in $(find "$SRC" \( -name 'mkbootimg' -o -name 'mkbootimg.py' \) -type f 2>/dev/null); do
            sed -i 's/parse_args()/parse_known_args()[0]/g' "$b" 2>/dev/null
            if grep -qs 'parse_known_args()\[0\]' "$b"; then
              found=1
              echo "VERIFY-OK: patched $b"
            else
              echo "VERIFY-WARN: no change in $b"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: could not patch any mkbootimg; aborting"
            exit 1
          fi
          mka "${{ github.event.inputs.target || 'recoveryimage' }}" -j$(nproc)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "== build failed; re-applying patch to generated host bin =="
            # safety net: if the patched source got overwritten during sync of
            # the host prebuilt, patch the installed binary directly.
            sed -i 's/parse_args()/parse_known_args()[0]/g' \
              "$SRC/out/host/linux-x86/bin/mkbootimg" 2>/dev/null || true
            mka "${{ github.event.inputs.target || 'recoveryimage' }}" -j$(nproc)
            rc=$?
          fi
          exit $rc

      - name: Show build artifacts
        run: |
          cd $GITHUB_WORKSPACE/$BUILD_DIR
          echo "== Build output =="
          ls -la out/target/product/y83/ || true
          file out/target/product/y83/recovery.img || true

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp_y83_recovery_${{ github.run_id }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/out/target/product/y83/recovery.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twrp_y83_buildlog_${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ env.BUILD_DIR }}/out/error.log
            ${{ github.workspace }}/${{ env.BUILD_DIR }}/out/*.log
          if-no-files-found: ignore
          retention-days: 7
